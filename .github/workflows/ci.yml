name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false
      - name: Ruff
        run: uvx ruff@0.16.10 check
      - name: Package the skill as the release workflow does
        run: bash .github/scripts/package_skill.sh ci dist

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false
      - name: Skill package checks
        run: uv run tests/test_skill_package.py
      - name: Library tests
        run: uv run skills/textbook2agent/book2library/scripts/test_textbook_library.py
      - name: Visualize tests
        run: uv run skills/textbook2agent/visualize/scripts/test_visualize.py

  engine:
    # Paper2Agent's own tests for the unchanged extraction engine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false
      - name: paper2skill engine tests
        run: uv run skills/textbook2agent/book2library/scripts/paper2skill/test_paper_bundle.py
